# Butterfly 主题配置
# https://butterfly.js.org/

# 导航栏
nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-heart

# 社交链接
social:
  fab fa-github: https://github.com/taoran-blog || Github || '#24292e'
  fas fa-rss: /taoran/atom.xml || RSS || '#ff6600'

# 头像（使用默认）
avatar:
  img: /img/butterfly-icon.png
  effect: true

# 首页大图 - 关闭图片，用渐变色
index_img: false
default_top_img: false
archive_img: false
tag_img: false
category_img: false

# 背景色 - 柔和的灰白渐变
background: '#f8f9fa'

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:

# 首页副标题
subtitle:
  enable: true
  effect: true
  source: 1
  sub: '记录技术成长，分享学习心得'

# 文章布局：封面在上，信息在下
index_layout: 4

# 目录
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false

# 代码块
code_blocks:
  theme: ocean
  macStyle: true
  word_wrap: true
  copy: true
  language: true

# 文章页底部信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: center
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 文章版权信息
post_copyright:
  enable: true
  decode: false

# Footer
footer:
  owner:
    enable: true
  copyright: true
  custom_text: '陶然的博客 · 记录技术成长'

# 右侧小工具
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/taoran-blog
  card_announcement:
    enable: true
    content: 欢迎来到陶然的博客！
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 6

# 页面加载动画
preloader: true

# 回到顶部
go_up:
  enable: true
  icon: fas fa-arrow-up

# 图片懒加载
lazyload:
  enable: true
  field: site

# 搜索
search:
  enable: true
  path: /search.xml
  field: post
  content: true

# 自定义 CSS 注入
inject:
  head:

# 评论系统 - Giscus（基于 GitHub Discussions）
comments:
  enable: true
  use: giscus
  giscus:
    repo: taoran-blog/taoran
    repo_id: R_kgDOTufwyw
    category: Announcements
    category_id: DIC_kwDOTufwy84DCtkW
    map: pathname
    input_position: top
    lang: zh-CN
    crossorigin: anonymous
    lazy_load: true