# Butterfly 主题配置
# https://butterfly.js.org/

# 导航栏
nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

# 社交链接
social:
  fab fa-github: https://github.com/718292306 || Github || '#24292e'

# 头像（使用默认）
avatar:
  img: /img/butterfly-icon.png
  effect: true

# 首页大图（使用默认）
index_img: /img/default.png
default_top_img: /img/default.png
archive_img: /img/default.png
tag_img: /img/default.png
category_img: /img/default.png

# 背景色
background: '#f5f5f5'

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:

# 首页副标题
subtitle:
  enable: true
  effect: true
  source: 1
  sub: '记录技术成长，分享学习心得'

# 文章布局：封面在上，信息在下
index_layout: 4

# 目录
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false

# 代码块
code_blocks:
  theme: ocean
  macStyle: true
  word_wrap: true
  copy: true
  language: true

# 文章页底部信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: center
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 文章版权信息
post_copyright:
  enable: true
  decode: false

# Footer
footer:
  owner:
    enable: true
  copyright: true
  custom_text: ''

# 右侧小工具
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 6

# 页面加载动画
preloader: true

# 回到顶部
go_up:
  enable: true
  icon: fas fa-arrow-up

# 图片懒加载
lazyload:
  enable: true
  field: site

# 搜索
search:
  enable: true
  path: /search.xml
  field: post
  content: true

# 评论系统
comments:
  enable: false